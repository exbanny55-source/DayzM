<h1>Настройки</h1>
<p class="settings-intro">
    Укажите пути к папкам и файлам DayZ.
    Изменения сохраняются отдельно в <code>paths.json</code>.
</p>

<div id="paths-status" class="paths-status"></div>

<form id="paths-form" class="paths-form" autocomplete="off">

    <!-- Строки путей рендерятся JS'ом из /api/paths -->
    <div id="paths-fields">
        <p class="paths-loading">Загрузка путей…</p>
    </div>

    <div class="paths-actions">
        <button type="button" class="btn btn-ghost" id="paths-reset">
            Сбросить всё
        </button>
        <button type="button" class="btn btn-primary" id="paths-save">
            💾 Сохранить
        </button>
    </div>

</form>
